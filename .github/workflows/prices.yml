name: Nightly prices

# Runs itself every night. Nobody has to remember.
on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC, which is 08:00 in India
  workflow_dispatch:        # ...and a button, for when we want it now

permissions:
  contents: write           # so it can commit the new prices back

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch today's closing prices
        env:
          # The key lives in GitHub Secrets. It is never in the code.
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: node scripts/fetch-prices.mjs

      - name: Save them if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Prices are unchanged today. Nothing to commit."
            exit 0
          fi
          git commit -m "Prices as of $(node -p "require('./data/meta.json').asOf")"
          git push
